name: trading_journal
description: Personal trading data management application
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  bloc: ^8.1.4

  # Database
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.18  
  sqlite3: ">=2.1.0 <2.5.0"
  path_provider: ^2.1.4
  path: ^1.9.0

  # Navigation
  go_router: ^14.2.7

  # Auth
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # File / Export
  csv: ^6.0.0
  share_plus: ^10.1.4
  file_picker: ^8.1.7

  # Image
  image_picker: ^1.1.2

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Charts
  fl_chart: ^0.69.0

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # API
  http: ^1.1.0

  # Utilities
  uuid: ^4.5.1
  crypto: ^3.0.6
  intl: ^0.19.0
  collection: ^1.19.1
  analyzer: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.3
  build_runner: 2.4.9
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
